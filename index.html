<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS AI</title>

<style>
:root {
  --bg:#eef4fa;
  --panel:#ffffff;
  --text:#172c40;
  --muted:#63788b;
  --line:#d1deea;
  --accent:#0879c9;
  --user:#e1edf8;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
  display:flex;
  flex-direction:column;
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 22px 10px;
}

h1 {
  font-size:22px;
  letter-spacing:4px;
  margin:0;
}

#status {
  color:var(--muted);
  font-size:14px;
}

#stage {
  height:340px;
  flex-shrink:0;
}

canvas {
  width:100%;
  height:100%;
}

#log {
  flex:1;
  overflow-y:auto;
  padding:12px 18px;
  width:100%;
  max-width:720px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg {
  max-width:90%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.5;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  align-self:flex-end;
  background:var(--user);
}

.ai {
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--line);
}

.sys {
  align-self:center;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

footer {
  width:100%;
  max-width:720px;
  margin:auto;
  padding:12px 16px calc(15px + env(safe-area-inset-bottom));
}

#bar {
  display:flex;
  gap:8px;
  align-items:center;
}

input[type="text"],
input[type="password"] {
  min-width:0;
  flex:1;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:30px;
  font-size:16px;
  background:var(--panel);
  color:var(--text);
  outline:none;
}

button {
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:30px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
  min-height:46px;
}

#mic {
  background:var(--accent);
  color:white;
  border-color:var(--accent);
  font-weight:bold;
}

#mic.active {
  background:#20a65a;
}

#opts {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

select {
  padding:9px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  max-width:175px;
}

#keyrow {
  display:none;
  gap:8px;
  margin-bottom:10px;
}

#keyrow.show {
  display:flex;
}

#keysave {
  background:var(--accent);
  color:white;
}

button:disabled {
  opacity:.5;
  cursor:not-allowed;
}

@media(max-height:700px) {
  #stage {
    height:230px;
  }
}
</style>
</head>

<body>

<header>
  <h1>JARVIS</h1>
  <div id="status">● Ready</div>
</header>

<div id="stage">
  <canvas id="orb"></canvas>
</div>

<div id="log" aria-live="polite"></div>

<footer>

  <div id="keyrow">
    <input
      id="key"
      type="password"
      placeholder="Paste Gemini API key"
      autocomplete="off"
    >
    <button id="keysave">Save</button>
  </div>

  <div id="bar">
    <input
      id="text"
      type="text"
      placeholder="Type or tap the mic"
      autocomplete="off"
    >

    <button id="send">Send</button>
    <button id="mic">Talk</button>
  </div>

  <div id="opts">

    <label>
      <input type="checkbox" id="speak" checked>
      Speak replies
    </label>

    <label>
      <input type="checkbox" id="loop">
      Keep listening
    </label>

    <select id="voice">
      <option value="">Default voice</option>
    </select>

    <button id="keybtn">Gemini key</button>

  </div>

</footer>

<script>

// ======================================
// JARVIS CONFIGURATION
// ======================================

const MODEL = "gemini-3.8-flash";

const API_URL =
  `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

const SYSTEM_PROMPT = `
You are JARVIS, a highly intelligent personal AI assistant.

Your personality:
- Intelligent, polite and professional.
- Friendly and conversational.
- Give clear and useful answers.
- Understand natural language.
- Keep simple answers short.
- Explain complicated topics properly.
- Address yourself as Jarvis.
- You are a personal voice assistant.
`;

// ======================================
// ELEMENTS
// ======================================

const $ = id => document.getElementById(id);

const log = $("log");
const input = $("text");
const sendBtn = $("send");
const micBtn = $("mic");
const status = $("status");

let apiKey = localStorage.getItem("jarvis_gemini_key") || "";

let busy = false;
let recognition = null;
let listening = false;
let manualStop = false;

let conversation = [];


// ======================================
// CHAT DISPLAY
// ======================================

function addMessage(message, type) {

  const div = document.createElement("div");

  div.className = "msg " + type;
  div.textContent = message;

  log.appendChild(div);

  log.scrollTop = log.scrollHeight;

}

function systemMessage(message) {
  addMessage(message, "sys");
}

function setStatus(message, mode = "idle") {

  status.textContent = "● " + message;

  document.body.dataset.mode = mode;

}


// ======================================
// API KEY MANAGEMENT
// ======================================

$("keybtn").onclick = () => {

  $("keyrow").classList.toggle("show");

  $("key").value = "";

};

$("keysave").onclick = () => {

  const newKey = $("key").value.trim();

  if (!newKey) {
    systemMessage("Please enter your Gemini API key.");
    return;
  }

  apiKey = newKey;

  localStorage.setItem("jarvis_gemini_key", apiKey);

  $("key").value = "";

  $("keyrow").classList.remove("show");

  systemMessage("Gemini key saved. You can now talk to Jarvis.");

};


// ======================================
// GEMINI AI CONNECTION
// ======================================

async function askGemini(message) {

  if (!apiKey) {

    $("keyrow").classList.add("show");

    throw new Error("Please save your Gemini API key first.");

  }

  const contents = [

    ...conversation,

    {
      role: "user",
      parts: [{ text: message }]
    }

  ];

  const response = await fetch(
    API_URL + "?key=" + encodeURIComponent(apiKey),
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        systemInstruction: {
          parts: [{
            text: SYSTEM_PROMPT
          }]
        },

        contents: contents,

        generationConfig: {
          temperature: 0.8,
          maxOutputTokens: 1500
        }

      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    const errorMessage =
      data.error?.message || "Unknown Gemini API error";

    if (response.status === 400) {
      throw new Error("Invalid API request: " + errorMessage);
    }

    if (response.status === 403) {
      throw new Error("API key permission denied. Check your key and API access.");
    }

    if (response.status === 404) {
      throw new Error("Gemini model or endpoint not found. Check the model name and API version.");
    }

    if (response.status === 429) {
      throw new Error("Gemini API quota exceeded. Please try again later.");
    }

    throw new Error(
      `Gemini error (${response.status}): ${errorMessage}`
    );

  }

  const answer = data.candidates?.[0]?.content?.parts
    ?.map(part => part.text || "")
    .join("")
    .trim();

  if (!answer) {

    throw new Error("Gemini returned an empty response.");

  }

  conversation.push(
    {
      role: "user",
      parts: [{ text: message }]
    },
    {
      role: "model",
      parts: [{ text: answer }]
    }
  );

  // Keep conversation context manageable.

  if (conversation.length > 20) {
    conversation = conversation.slice(-20);
  }

  return answer;

}


// ======================================
// TEXT TO SPEECH
// ======================================

function loadVoices() {

  const voices = speechSynthesis.getVoices();

  const select = $("voice");

  const previous = select.value;

  select.innerHTML = '<option value="">Default voice</option>';

  voices.forEach((voice, index) => {

    const option = document.createElement("option");

    option.value = index;

    option.textContent =
      voice.name + " (" + voice.lang + ")";

    select.appendChild(option);

  });

  if (previous) select.value = previous;

}

if ("speechSynthesis" in window) {

  speechSynthesis.onvoiceschanged = loadVoices;

  loadVoices();

}

function speakText(text) {

  return new Promise(resolve => {

    if (!$("speak").checked ||
        !("speechSynthesis" in window)) {

      resolve();
      return;

    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    const selected = $("voice").value;

    const voices = speechSynthesis.getVoices();

    if (selected !== "" && voices[selected]) {
      utterance.voice = voices[selected];
    }

    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = () => {
      setStatus("Speaking", "speaking");
    };

    utterance.onend = () => {
      setStatus("Ready");
      resolve();
    };

    utterance.onerror = () => {
      setStatus("Ready");
      resolve();
    };

    speechSynthesis.speak(utterance);

  });

}


// ======================================
// SEND MESSAGE
// ======================================

async function sendMessage(message) {

  message = message.trim();

  if (!message || busy) return;

  if (recognition && listening) {
    manualStop = true;
    recognition.stop();
  }

  input.value = "";

  addMessage(message, "user");

  busy = true;

  sendBtn.disabled = true;

  setStatus("Thinking", "thinking");

  try {

    const reply = await askGemini(message);

    addMessage(reply, "ai");

    await speakText(reply);

    setStatus("Ready");

  }

  catch(error) {

    console.error("Jarvis error:", error);

    addMessage(
      "Error: " + error.message,
      "sys"
    );

    setStatus("Error");

  }

  finally {

    busy = false;

    sendBtn.disabled = false;

    if ($("loop").checked) {

      setTimeout(() => {

        if (!busy && !listening) {
          startListening();
        }

      }, 700);

    }

  }

}


// ======================================
// BUTTON EVENTS
// ======================================

sendBtn.onclick = () => {
  sendMessage(input.value);
};

input.addEventListener("keydown", event => {

  if (event.key === "Enter") {
    sendMessage(input.value);
  }

});


// ======================================
// SPEECH RECOGNITION
// ======================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-AU";

  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.onstart = () => {

    listening = true;

    micBtn.classList.add("active");

    micBtn.textContent = "Listening";

    setStatus("Listening", "listening");

  };

  recognition.onresult = event => {

    let finalText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
        event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalText += transcript;
      }

    }

    if (finalText.trim()) {

      input.value = finalText.trim();

      if ($("loop").checked) {

        sendMessage(finalText);

      }

    }

  };

  recognition.onerror = event => {

    console.error("Microphone error:", event.error);

    if (event.error === "not-allowed") {

      systemMessage(
        "Microphone permission denied. Allow microphone access in your browser settings."
      );

    }

    else if (event.error !== "no-speech" &&
             event.error !== "aborted") {

      systemMessage(
        "Microphone error: " + event.error
      );

    }

  };

  recognition.onend = () => {

    listening = false;

    micBtn.classList.remove("active");

    micBtn.textContent = "Talk";

    setStatus("Ready");

    if ($("loop").checked &&
        !manualStop &&
        !busy) {

      setTimeout(startListening, 500);

    }

    manualStop = false;

  };

}

function startListening() {

  if (!recognition) {

    systemMessage(
      "Speech recognition is not supported in this browser."
    );

    return;

  }

  if (listening || busy) return;

  manualStop = false;

  try {

    recognition.start();

  }

  catch(error) {

    console.error(error);

  }

}

function stopListening() {

  if (!recognition || !listening) return;

  manualStop = true;

  recognition.stop();

}

micBtn.onclick = () => {

  if (listening) {

    $("loop").checked = false;

    stopListening();

  }

  else {

    startListening();

  }

};


// ======================================
// KEEP LISTENING
// ======================================

$("loop").onchange = () => {

  if ($("loop").checked) {

    startListening();

  }

  else {

    stopListening();

  }

};


// ======================================
// ANIMATED JARVIS ORB
// ======================================

const canvas = $("orb");

const ctx = canvas.getContext("2d");

let particles = [];

let width = 0;
let height = 0;

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = rect.width;
  height = rect.height;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  particles = [];

  const count = 430;

  for (let i = 0; i < count; i++) {

    const angle = Math.random() * Math.PI * 2;

    const radius = Math.sqrt(Math.random());

    particles.push({

      angle,
      radius,

      size: Math.random() * 2.5 + 0.7,

      speed: (Math.random() - 0.5) * 0.002,

      alpha: Math.random() * 0.6 + 0.3

    });

  }

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

let time = 0;

function animate() {

  requestAnimationFrame(animate);

  time += 0.01;

  ctx.clearRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;

  const radius = Math.min(width, height) * 0.34;

  const mode = document.body.dataset.mode;

  const pulse =
    mode === "listening" ? 1.12 :
    mode === "thinking" ? 1.05 :
    mode === "speaking" ? 1.09 :
    1;

  const gradient = ctx.createRadialGradient(
    cx, cy, 5,
    cx, cy, radius * 1.8
  );

  gradient.addColorStop(0, "rgba(30,140,220,0.12)");
  gradient.addColorStop(1, "rgba(30,140,220,0)");

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.arc(cx, cy, radius * 1.8, 0, Math.PI * 2);

  ctx.fill();

  particles.forEach(p => {

    p.angle += p.speed;

    const wave =
      Math.sin(time + p.angle * 3) * 3;

    const r =
      (radius * p.radius + wave) * pulse;

    const x = cx + Math.cos(p.angle) * r;

    const y = cy + Math.sin(p.angle) * r;

    ctx.beginPath();

    ctx.arc(x, y, p.size, 0, Math.PI * 2);

    ctx.fillStyle =
      `rgba(20,115,190,${p.alpha})`;

    ctx.fill();

  });

}

animate();


// ======================================
// INITIALIZATION
// ======================================

if (!apiKey) {

  setStatus("API key required");

  $("keyrow").classList.add("show");

  systemMessage(
    "Welcome! Save your Gemini API key to activate Jarvis."
  );

}
else {

  setStatus("Ready");

  systemMessage(
    "Jarvis is ready. Type a message or tap Talk."
  );

}

</script>

</body>
</html>
