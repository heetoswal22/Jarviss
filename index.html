<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --bg: #07111c;
    --panel: #0d1b2a;
    --line: #1b3147;
    --text: #dbe9f6;
    --muted: #7f97ad;
    --orb: 120, 200, 255;
    --accent: #5cc8ff;
    --warn: #ffb454;
    --user: #12263a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef4f9;
      --panel: #ffffff;
      --line: #cddbe7;
      --text: #12273a;
      --muted: #587087;
      --orb: 20, 110, 190;
      --accent: #0a74c4;
      --warn: #b86a00;
      --user: #e1edf7;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100dvh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 0;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .12em; margin: 0; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  body[data-mode="listening"] #dot { background: #46e08a; }
  body[data-mode="thinking"] #dot { background: var(--warn); }
  body[data-mode="speaking"] #dot { background: var(--accent); }

  #stage { position: relative; flex: 0 0 auto; height: min(44vh, 360px); }
  canvas { width: 100%; height: 100%; display: block; }

  #log {
    flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 13px; background: none; padding: 2px; }

  .msg.act { align-self: flex-start; background: none; padding: 0; }
  .msg.act button { background: var(--accent); color: #04111c; border-color: var(--accent); font-weight: 600; height: auto; padding: 11px 18px; text-align: left; }
  #side { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 16px; display: none; }
  #side.on { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .chip.timer { color: var(--warn); border-color: var(--warn); }

  footer {
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  #bar { display: flex; gap: 8px; align-items: center; }
  #text {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 12px 16px; outline: none;
  }
  #text:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; height: 46px; min-width: 46px; padding: 0 14px;
  }
  #mic { background: var(--accent); color: #04111c; border-color: var(--accent); font-weight: 600; }
  body[data-mode="listening"] #mic { box-shadow: 0 0 0 6px rgba(70, 224, 138, .25); background: #46e08a; border-color: #46e08a; }
  #opts { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  select { font: inherit; font-size: 13px; max-width: 190px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  label.toggle { display: flex; align-items: center; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-mode="idle">
<header>
  <h1>JARVIS</h1>
  <div id="status"><span id="dot"></span><span id="statusText">Ready</span></div>
</header>

<div id="stage"><canvas id="orb" aria-label="Jarvis status orb"></canvas></div>

<div id="side"><div class="chips" id="chips"></div></div>
<div id="log" aria-live="polite"></div>

<footer>
  <div id="bar">
    <input id="text" type="text" placeholder="Type or tap the mic" autocomplete="off" enterkeyhint="send">
    <button id="send" aria-label="Send">Send</button>
    <button id="mic" aria-label="Talk to Jarvis">Talk</button>
  </div>
  <div id="keyrow" style="display:none;margin-top:8px;gap:8px">
    <input id="key" type="password" placeholder="Gemini API key (AIza...)" autocomplete="off" style="flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none">
    <button id="keysave" style="height:40px">Save key</button>
  </div>
  <div id="opts">
    <label class="toggle"><input type="checkbox" id="speak" checked> Speak replies</label>
    <label class="toggle"><input type="checkbox" id="loop"> Keep listening</label>
    <select id="voice" aria-label="Voice"></select>
    <button id="keybtn" style="height:32px;min-width:0;font-size:13px">Gemini key</button>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
