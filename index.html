<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --bg: #07111c;
    --panel: #0d1b2a;
    --line: #1b3147;
    --text: #dbe9f6;
    --muted: #7f97ad;
    --orb: 120, 200, 255;
    --accent: #5cc8ff;
    --warn: #ffb454;
    --user: #12263a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef4f9;
      --panel: #ffffff;
      --line: #cddbe7;
      --text: #12273a;
      --muted: #587087;
      --orb: 20, 110, 190;
      --accent: #0a74c4;
      --warn: #b86a00;
      --user: #e1edf7;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100dvh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 0;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .12em; margin: 0; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  body[data-mode="listening"] #dot { background: #46e08a; }
  body[data-mode="thinking"] #dot { background: var(--warn); }
  body[data-mode="speaking"] #dot { background: var(--accent); }

  #stage { position: relative; flex: 0 0 auto; height: min(44vh, 360px); }
  canvas { width: 100%; height: 100%; display: block; }

  #log {
    flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 13px; background: none; padding: 2px; }

  .msg.act { align-self: flex-start; background: none; padding: 0; }
  .msg.act button { background: var(--accent); color: #04111c; border-color: var(--accent); font-weight: 600; height: auto; padding: 11px 18px; text-align: left; }
  #side { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 16px; display: none; }
  #side.on { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .chip.timer { color: var(--warn); border-color: var(--warn); }

  footer {
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  #bar { display: flex; gap: 8px; align-items: center; }
  #text {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 12px 16px; outline: none;
  }
  #text:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; height: 46px; min-width: 46px; padding: 0 14px;
  }
  #mic { background: var(--accent); color: #04111c; border-color: var(--accent); font-weight: 600; }
  body[data-mode="listening"] #mic { box-shadow: 0 0 0 6px rgba(70, 224, 138, .25); background: #46e08a; border-color: #46e08a; }
  #opts { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  select { font: inherit; font-size: 13px; max-width: 190px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  label.toggle { display: flex; align-items: center; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-mode="idle">
<header>
  <h1>JARVIS</h1>
  <div id="status"><span id="dot"></span><span id="statusText">Ready</span></div>
</header>

<div id="stage"><canvas id="orb" aria-label="Jarvis status orb"></canvas></div>

<div id="side"><div class="chips" id="chips"></div></div>
<div id="log" aria-live="polite"></div>

<footer>
  <div id="bar">
    <input id="text" type="text" placeholder="Type or tap the mic" autocomplete="off" enterkeyhint="send">
    <button id="send" aria-label="Send">Send</button>
    <button id="mic" aria-label="Talk to Jarvis">Talk</button>
  </div>
  <div id="keyrow" style="display:none;margin-top:8px;gap:8px">
    <input id="key" type="password" placeholder="Anthropic API key (sk-ant-...)" autocomplete="off" style="flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none">
    <button id="keysave" style="height:40px">Save key</button>
  </div>
  <div id="opts">
    <label class="toggle"><input type="checkbox" id="speak" checked> Speak replies</label>
    <label class="toggle"><input type="checkbox" id="loop"> Keep listening</label>
    <select id="voice" aria-label="Voice"></select>
    <button id="keybtn" style="height:32px;min-width:0;font-size:13px">API key</button>
  </div>
</footer>

<script>
/* ---------- Config: edit these to make Jarvis yours ---------- */
const OWNER = "Boss";   // what Jarvis calls you
const PERSONA = `You are JARVIS, a calm, sharp, slightly witty personal assistant, in the spirit of the AI from Iron Man.
Address the user as "${OWNER}" occasionally, not every sentence.
Your replies are spoken aloud, so keep them short (1-3 sentences), plain text, no markdown, no lists, no emojis.
Be direct and useful. If a request needs a long answer, give the key points and offer to go deeper.
You can trigger actions on the user's phone. When the user asks you to call, text, WhatsApp or email someone, open maps or directions, play or search YouTube, search the web, open a website, or set a timer, reply with ONE short spoken sentence confirming it, then on a new final line write ACTION: followed by a single JSON object and nothing after it.
Action shapes:
{"type":"call","to":"<number or saved contact name>"}
{"type":"sms","to":"<number or saved contact name>","body":"<message>"}
{"type":"whatsapp","to":"<number or saved contact name>","body":"<message>"}
{"type":"email","to":"<email address or saved contact name>","subject":"<subject>","body":"<message>"}
{"type":"maps","query":"<place>","directions":true}
{"type":"youtube","query":"<search>"}
{"type":"search","query":"<search>"}
{"type":"open","url":"<https url>"}
{"type":"timer","seconds":300,"label":"<short label>"}
Use only the saved contacts listed below or numbers and addresses the user gives you. If a needed number or address is missing, ask for it instead of guessing. The user opens each action with one tap, so never say it already happened. You cannot set real alarms or calendar events from here; suggest the Claude app voice mode for those.
Local abilities handled by the app itself: timers, notes ("note: buy milk"), and saving contacts ("save contact Mom 9876543210").`;

/* ---------- Elements & state ---------- */
const $ = id => document.getElementById(id);
const logEl = $('log'), textEl = $('text'), micBtn = $('mic');
let mode = 'idle', convo = [], voices = [], recog = null, listening = false, busy = false, amp = 0;
const timers = []; let notes = [];

function setMode(m, label) {
  mode = m; document.body.dataset.mode = m;
  $('statusText').textContent = label || ({idle:'Ready', listening:'Listening', thinking:'Thinking', speaking:'Speaking'})[m];
}
function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; return d;
}
function renderChips() {
  const side = $('side'), c = $('chips'); c.innerHTML = '';
  timers.forEach(t => { const e = document.createElement('span'); e.className = 'chip timer'; e.textContent = t.label + ' · ' + Math.max(0, Math.ceil((t.end - Date.now())/1000)) + 's'; c.appendChild(e); });
  notes.slice(-4).forEach(n => { const e = document.createElement('span'); e.className = 'chip'; e.textContent = n; c.appendChild(e); });
  side.classList.toggle('on', c.children.length > 0);
}
setInterval(() => { if (timers.length) renderChips(); }, 1000);

/* ---------- Orb ---------- */
const cv = $('orb'), ctx = cv.getContext('2d');
const N = 520, pts = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y*y), th = Math.PI * (3 - Math.sqrt(5)) * i;
  pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
}
let rot = 0, W = 0, H = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize); resize();
function frame(t) {
  const col = getComputedStyle(document.body).getPropertyValue('--orb').trim();
  ctx.clearRect(0, 0, W, H);
  const speed = mode === 'thinking' ? 0.03 : mode === 'listening' ? 0.012 : 0.005;
  rot += speed;
  const target = mode === 'speaking' ? 0.12 + 0.1 * Math.sin(t / 90) * Math.sin(t / 230) : mode === 'listening' ? 0.06 + 0.03 * Math.sin(t / 300) : 0.02 * Math.sin(t / 900);
  amp += (target - amp) * 0.15;
  const R = Math.min(W, H) * 0.36 * (1 + amp);
  const cx = W / 2, cy = H / 2, cr = Math.cos(rot), sr = Math.sin(rot), tilt = 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
  const g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.5);
  g.addColorStop(0, `rgba(${col},${mode==='idle'?0.10:0.22})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const p of pts) {
    let x = p[0]*cr + p[2]*sr, z = -p[0]*sr + p[2]*cr, y = p[1];
    const y2 = y*ct - z*st, z2 = y*st + z*ct;
    const k = mode === 'speaking' ? 1 + amp * 0.8 * Math.sin(p[1]*6 + t/120) : 1;
    const a = 0.25 + 0.75 * (z2 + 1) / 2;
    ctx.fillStyle = `rgba(${col},${a})`;
    ctx.beginPath(); ctx.arc(cx + x*R*k, cy + y2*R*k, 0.9 + a * 1.3, 0, 6.283); ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Voice out ---------- */
let synth = null;
try { synth = window.speechSynthesis || null; if (synth && typeof SpeechSynthesisUtterance === 'undefined') synth = null; } catch (_) { synth = null; }
function stopSpeaking() { try { if (synth) synth.cancel(); } catch (_) {} }

function loadVoices() {
  try { voices = synth ? synth.getVoices() : []; } catch (_) { voices = []; }
  const sel = $('voice'); const keep = sel.value; sel.innerHTML = '';
  const list = voices.filter(v => /^en/i.test(v.lang)); (list.length ? list : voices).forEach(v => {
    const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o);
  });
  const pref = [...sel.options].find(o => /british|uk|daniel|google uk english male/i.test(o.textContent));
  if (keep) sel.value = keep; else if (pref) sel.value = pref.value;
}
if (synth) { loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (_) {} }
else { $('speak').checked = false; $('speak').disabled = true; $('voice').style.display = 'none'; }

function speak(text) {
  return new Promise(res => {
    if (!$('speak').checked || !synth) return res();
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g, ''));
    const v = voices.find(v => v.name === $('voice').value); if (v) u.voice = v;
    u.rate = 1.02; u.pitch = 0.95;
    u.onstart = () => setMode('speaking'); u.onend = u.onerror = () => res();
    setTimeout(() => { try { if (!synth.speaking && !synth.pending) res(); } catch (_) { res(); } }, 4000);
    try { synth.speak(u); } catch (_) { res(); }
  });
}

/* ---------- Voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startListening() {
  if (!SR) { addMsg('sys', 'Voice input is not supported in this browser. Type instead, or open the file in Chrome or Safari.'); return; }
  if (listening || busy) return;
  stopSpeaking();
  recog = new SR(); recog.lang = 'en-US'; recog.interimResults = true; recog.continuous = false;
  let finalText = '';
  recog.onstart = () => { listening = true; setMode('listening'); };
  recog.onresult = e => {
    let s = ''; for (const r of e.results) { s += r[0].transcript; if (r.isFinal) finalText = s; }
    textEl.value = s;
  };
  recog.onerror = e => {
    listening = false; setMode('idle');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') addMsg('sys', 'Microphone is blocked here. Allow mic access, or open the downloaded file in your browser.');
  };
  recog.onend = () => {
    listening = false;
    const t = (finalText || textEl.value).trim();
    if (t) send(t); else { setMode('idle'); }
  };
  try { recog.start(); } catch (_) {}
}
micBtn.onclick = () => listening ? recog.stop() : startListening();

/* ---------- Local abilities ---------- */
function fmtDuration(s) {
  if (s % 3600 === 0) { const h = s / 3600; return h + ' hour' + (h > 1 ? 's' : ''); }
  if (s % 60 === 0) { const m = s / 60; return m + ' minute' + (m > 1 ? 's' : ''); }
  return s + ' second' + (s > 1 ? 's' : '');
}
function startTimer(secs, label) {
  label = label || fmtDuration(secs);
  const item = { label, end: Date.now() + secs * 1000 };
  item.id = setTimeout(() => {
    timers.splice(timers.indexOf(item), 1); renderChips();
    const msg = `${OWNER}, your ${label} timer is up.`; addMsg('ai', msg); speak(msg).then(() => setMode('idle'));
  }, secs * 1000);
  timers.push(item); renderChips();
  return `Timer set for ${label}.`;
}
function localIntent(t) {
  let m = t.match(/(?:set|start)?\s*(?:a\s+)?timer\s+(?:for\s+)?(\d+)\s*(second|sec|minute|min|hour|hr)/i)
        || t.match(/remind me in\s+(\d+)\s*(second|sec|minute|min|hour|hr)/i);
  if (m) {
    const n = +m[1], u = m[2].toLowerCase(), secs = /^h/.test(u) ? n*3600 : /^m/.test(u) ? n*60 : n;
    const unit = /^h/.test(u) ? 'hour' : /^m/.test(u) ? 'minute' : 'second';
    const label = n + ' ' + unit + (n > 1 ? 's' : '');
    return startTimer(secs, label);
  }
  m = t.match(/^(?:note|remember|jot down)\s*[:\-]?\s*(.+)$/i);
  if (m) { notes.push(m[1].trim()); saveNotes(); renderChips(); return 'Noted.'; }
  if (/^(show|read) (my )?notes/i.test(t)) return notes.length ? 'Your notes: ' + notes.join('. ') : 'You have no notes yet.';
  m = t.match(/^(?:save|add)\s+(?:contact\s+)?([a-z][a-z .'-]*?)\s*(?:as|number|is|at|:)?\s*(\+?\d[\d\s-]{6,})$/i);
  if (m) { contacts[m[1].trim().toLowerCase()] = m[2].replace(/[\s-]/g, ''); saveContacts(); return 'Saved ' + m[1].trim() + '.'; }
  if (/^(show|list|read) (my )?contacts/i.test(t)) { const k = Object.keys(contacts); return k.length ? 'Saved contacts: ' + k.join(', ') + '.' : 'No contacts saved yet. Say: save contact Mom 9876543210.'; }
  return null;
}
async function saveNotes() { try { await window.storage.set('jarvis:notes', JSON.stringify(notes), false); } catch (_) {} }
(async () => { try { const r = await window.storage.get('jarvis:notes', false); if (r) { notes = JSON.parse(r.value); renderChips(); } } catch (_) {} })();


/* ---------- Contacts & phone actions ---------- */
const COUNTRY_CODE = '';   // e.g. '91' for India, '1' for US/Canada: added to numbers that have no + prefix
let contacts = {};
try { contacts = JSON.parse(localStorage.getItem('jarvis_contacts') || '{}'); } catch (_) {}
async function saveContacts() {
  try { localStorage.setItem('jarvis_contacts', JSON.stringify(contacts)); } catch (_) {}
  try { await window.storage.set('jarvis:contacts', JSON.stringify(contacts), false); } catch (_) {}
}
(async () => { try { const r = await window.storage.get('jarvis:contacts', false); if (r) contacts = Object.assign(JSON.parse(r.value), contacts); } catch (_) {} })();

function resolveNumber(x) {
  if (!x) return '';
  const saved = contacts[String(x).trim().toLowerCase()];
  let n = String(saved || x).replace(/[^\d+]/g, '');
  if (n && !n.startsWith('+') && COUNTRY_CODE && n.length <= 10) n = '+' + COUNTRY_CODE + n;
  return n;
}
function buildAction(a) {
  const enc = encodeURIComponent, who = a.to ? String(a.to) : '';
  const web = u => (/^https:\/\//i.test(u) ? u : null);
  switch (a.type) {
    case 'call': { const n = resolveNumber(a.to); return n ? { label: 'Call ' + who, url: 'tel:' + n } : null; }
    case 'sms': { const n = resolveNumber(a.to); return n ? { label: 'Text ' + who, url: 'sms:' + n + '?&body=' + enc(a.body || '') } : null; }
    case 'whatsapp': { const n = resolveNumber(a.to).replace(/\D/g, ''); return n ? { label: 'WhatsApp ' + who, url: 'https://wa.me/' + n + '?text=' + enc(a.body || '') } : null; }
    case 'email': {
      const saved = contacts[who.toLowerCase()]; const to = saved && saved.includes('@') ? saved : who;
      return to.includes('@') ? { label: 'Email ' + to, url: 'mailto:' + to + '?subject=' + enc(a.subject || '') + '&body=' + enc(a.body || '') } : null;
    }
    case 'maps': {
      if (!a.query) return null;
      return a.directions
        ? { label: 'Directions to ' + a.query, url: 'https://www.google.com/maps/dir/?api=1&destination=' + enc(a.query) }
        : { label: 'Open ' + a.query + ' in Maps', url: 'https://www.google.com/maps/search/?api=1&query=' + enc(a.query) };
    }
    case 'youtube': return a.query ? { label: 'YouTube: ' + a.query, url: 'https://www.youtube.com/results?search_query=' + enc(a.query) } : null;
    case 'search': return a.query ? { label: 'Search: ' + a.query, url: 'https://www.google.com/search?q=' + enc(a.query) } : null;
    case 'open': { const u = web(a.url); return u ? { label: 'Open ' + u.replace(/^https:\/\/(www\.)?/, '').split('/')[0], url: u } : null; }
  }
  return null;
}
function openUrl(u) { if (/^https?:/i.test(u)) window.open(u, '_blank', 'noopener'); else location.href = u; }
function showAction(a) {
  if (a && a.type === 'timer') { const s = Math.round(+a.seconds); if (s > 0) startTimer(s, a.label); return; }
  const b = a && buildAction(a);
  if (!b) { addMsg('sys', 'I need a number or address for that. Tell me and I will try again.'); return; }
  const d = document.createElement('div'); d.className = 'msg act';
  const btn = document.createElement('button'); btn.textContent = b.label; btn.onclick = () => openUrl(b.url);
  d.appendChild(btn); logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function extractAction(text) {
  const m = text.match(/ACTION:\s*(\{[\s\S]*\})\s*$/);
  if (!m) return { text, action: null };
  let action = null; try { action = JSON.parse(m[1]); } catch (_) {}
  return { text: text.slice(0, m.index).trim(), action };
}

/* ---------- Brain (Claude) ---------- */
let apiKey = '';
try { apiKey = localStorage.getItem('jarvis_key') || ''; } catch (_) {}
$('keybtn').onclick = () => { const r = $('keyrow'); r.style.display = r.style.display === 'none' ? 'flex' : 'none'; };
$('keysave').onclick = () => {
  apiKey = $('key').value.trim(); $('key').value = '';
  try { localStorage.setItem('jarvis_key', apiKey); } catch (_) {}
  $('keyrow').style.display = 'none'; addMsg('sys', apiKey ? 'API key saved. Try again.' : 'API key cleared.');
};
async function askClaude() {
  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) { headers['x-api-key'] = apiKey; headers['anthropic-version'] = '
